name: Exact rational solver

on:
  pull_request:
    paths:
      - "app.py"
      - "rational_search.py"
      - "elliptic_engine.py"
      - "sage_bridge.py"
      - "tests/**"
      - "requirements.txt"
      - "frontend/src/app/app/**"
      - ".github/workflows/rational-solver.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "rational_search.py"
      - "elliptic_engine.py"
      - "sage_bridge.py"
      - "tests/**"
      - "requirements.txt"
      - "frontend/src/app/app/**"
      - ".github/workflows/rational-solver.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rational-solver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test exact rational engine
        run: |
          python -m py_compile app.py rational_search.py elliptic_engine.py sage_bridge.py
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build solver interface
        working-directory: frontend
        run: npm run build
